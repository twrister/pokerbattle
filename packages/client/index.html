<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokerBattle</title>
    <style>
      :root {
        --panel-bg: rgba(19, 24, 33, 0.82);
        --panel-border: rgba(126, 145, 178, 0.22);
        --text: #e6edf3;
        --text-dim: #8b98ab;
        --blue: #4f8dfd;
        --red: #f2604f;
        --accent: #63d68a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1117;
        color: var(--text);
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 13px;
        user-select: none;
      }

      .is-hidden {
        display: none !important;
      }

      #main-menu {
        position: fixed;
        inset: 0;
        z-index: 10;
        overflow: auto;
        background:
          radial-gradient(circle at 50% 24%, rgba(58, 88, 116, 0.34), transparent 34%),
          linear-gradient(160deg, #101924 0%, #0a1018 54%, #10141b 100%);
      }

      .lobby-shell {
        position: relative;
        display: flex;
        flex-direction: column;
        width: min(100%, calc(100svh * 0.5625));
        min-height: 100svh;
        margin: 0 auto;
        padding:
          max(env(safe-area-inset-top), clamp(20px, 3.2vh, 54px))
          clamp(20px, 5vw, 52px)
          max(env(safe-area-inset-bottom), clamp(18px, 2.8vh, 44px));
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.025), transparent 32%),
          rgba(10, 16, 24, 0.54);
        box-shadow: 0 0 80px rgba(0, 0, 0, 0.48);
      }

      .lobby-shell::before,
      .lobby-shell::after {
        content: '';
        position: absolute;
        border: 1px solid rgba(174, 198, 218, 0.08);
        transform: rotate(18deg);
        pointer-events: none;
      }

      .lobby-shell::before {
        top: 12%;
        right: -28%;
        width: 70%;
        aspect-ratio: 1;
        border-radius: 28%;
      }

      .lobby-shell::after {
        bottom: 11%;
        left: -36%;
        width: 64%;
        aspect-ratio: 1;
        border-radius: 50%;
      }

      .lobby-topbar,
      .lobby-hero,
      .lobby-actions,
      .lobby-nav {
        position: relative;
        z-index: 1;
      }

      .lobby-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .player-card {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .player-avatar {
        display: grid;
        width: clamp(38px, 6vh, 58px);
        aspect-ratio: 1;
        place-items: center;
        border: 1px solid rgba(169, 198, 220, 0.38);
        border-radius: 50%;
        background: linear-gradient(145deg, #26384b, #152232);
        color: #d9e9f5;
        font-size: clamp(14px, 2.2vh, 21px);
        font-weight: 700;
      }

      .player-copy {
        min-width: 0;
      }

      .player-name {
        overflow: hidden;
        color: #f4f7fa;
        font-size: clamp(14px, 2vh, 19px);
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-level {
        margin-top: 2px;
        color: #79899b;
        font-size: clamp(10px, 1.4vh, 13px);
        letter-spacing: 0.08em;
      }

      .lobby-hero {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: clamp(24px, 6vh, 76px) 0 clamp(18px, 4vh, 48px);
        text-align: center;
      }

      .hero-mark {
        position: relative;
        display: grid;
        width: clamp(118px, 20vh, 210px);
        aspect-ratio: 0.74;
        place-items: center;
        margin-bottom: clamp(22px, 4vh, 46px);
        border: 1px solid rgba(175, 199, 218, 0.26);
        border-radius: 16px;
        background:
          linear-gradient(145deg, rgba(116, 153, 180, 0.18), rgba(12, 20, 29, 0.82)),
          #121e2a;
        box-shadow:
          18px 18px 0 -7px rgba(32, 48, 63, 0.66),
          0 28px 70px rgba(0, 0, 0, 0.32);
        color: #d7ecf8;
        font-family: Georgia, serif;
        font-size: clamp(48px, 8vh, 84px);
        transform: rotate(-4deg);
      }

      .hero-mark::after {
        content: '♠';
        position: absolute;
        right: 12px;
        bottom: 8px;
        color: rgba(215, 236, 248, 0.25);
        font-size: 0.34em;
        transform: rotate(180deg);
      }

      .lobby-kicker {
        color: #7690a6;
        font-size: clamp(10px, 1.5vh, 14px);
        font-weight: 650;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }

      .lobby-title {
        margin: clamp(8px, 1.5vh, 16px) 0 0;
        color: #f2f5f7;
        font-size: clamp(36px, 6.2vh, 66px);
        font-weight: 720;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      .lobby-subtitle {
        max-width: 28em;
        margin: clamp(12px, 2vh, 20px) auto 0;
        color: #8292a2;
        font-size: clamp(12px, 1.7vh, 16px);
        line-height: 1.7;
      }

      .lobby-actions {
        display: grid;
        gap: clamp(8px, 1.5vh, 14px);
      }

      .lobby-play-row {
        display: grid;
        grid-template-columns: 1fr 1.35fr;
        gap: 10px;
      }

      .play-entry {
        width: 100%;
        padding: clamp(14px, 2.4vh, 23px) 14px;
        border-radius: 14px;
        font-size: clamp(15px, 2.3vh, 21px);
        font-weight: 680;
        letter-spacing: 0.08em;
      }

      .play-entry small {
        display: block;
        margin-top: 5px;
        font-size: 0.52em;
        font-weight: 500;
        letter-spacing: 0.12em;
      }

      #btn-solo {
        border: 1px solid rgba(139, 165, 184, 0.28);
        background: rgba(255, 255, 255, 0.04);
        color: #d5e2ec;
      }

      #btn-solo small {
        color: rgba(180, 198, 214, 0.62);
      }

      #btn-match {
        border: 1px solid rgba(153, 207, 237, 0.52);
        background: linear-gradient(135deg, #3d718f, #294c68);
        box-shadow: 0 12px 28px rgba(17, 57, 82, 0.32);
        color: #f7fbfd;
      }

      #btn-match small {
        color: rgba(232, 245, 251, 0.66);
      }

      #lobby-status {
        min-height: 1.4em;
        color: transparent;
        font-size: clamp(10px, 1.4vh, 13px);
        text-align: center;
        transition: color 0.18s;
      }

      #lobby-status.is-visible {
        color: #8192a4;
      }

      .lobby-nav {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: clamp(8px, 1.4vh, 14px);
        padding-top: clamp(12px, 2vh, 20px);
        border-top: 1px solid rgba(137, 158, 177, 0.13);
      }

      .nav-entry {
        display: grid;
        gap: 5px;
        place-items: center;
        min-width: 0;
        padding: clamp(9px, 1.6vh, 15px) 5px;
        border-color: transparent;
        background: transparent;
        color: #718192;
      }

      .nav-entry:hover {
        border-color: rgba(139, 165, 184, 0.14);
        background: rgba(255, 255, 255, 0.035);
      }

      .nav-icon {
        color: #91a8ba;
        font-size: clamp(19px, 3vh, 28px);
        line-height: 1;
      }

      .nav-label {
        font-size: clamp(11px, 1.55vh, 14px);
        font-weight: 600;
      }

      .nav-tag {
        color: #536272;
        font-size: clamp(8px, 1.05vh, 10px);
        letter-spacing: 0.12em;
      }

      @media (max-aspect-ratio: 1 / 1) {
        .lobby-shell {
          width: 100%;
          box-shadow: none;
        }
      }

      @media (max-height: 620px) {
        .hero-mark {
          width: 90px;
          margin-bottom: 16px;
        }

        .lobby-hero {
          padding: 16px 0 12px;
        }

        .lobby-subtitle {
          display: none;
        }
      }

      #app {
        position: fixed;
        inset: 0;
      }

      canvas {
        display: block;
      }

      /* HUD 整体不吃事件，只有具体控件吃，这样空白处的点击能穿透到画布上放兵 */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .panel {
        position: absolute;
        pointer-events: auto;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      }

      #panel-stats {
        top: 16px;
        left: 16px;
        min-width: 188px;
      }

      #panel-controls {
        top: 16px;
        right: 16px;
      }

      #btn-back-menu {
        position: absolute;
        top: 16px;
        left: 50%;
        pointer-events: auto;
        transform: translateX(-50%);
      }

      #panel-spawn {
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
        align-items: flex-end;
      }

      #panel-help {
        bottom: 16px;
        left: 16px;
        max-width: 230px;
        color: var(--text-dim);
        line-height: 1.7;
      }

      /* 锚在右下角；column-reverse 让标题+切换钮始终贴底，展开收起位置不变 */
      #panel-config {
        bottom: 16px;
        right: 16px;
        width: auto;
        max-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column-reverse;
        gap: 10px;
        z-index: 5;
      }

      /* 展开后铺满视口（留边距），内容在上、切换钮仍在右下角 */
      #panel-config:not(.is-collapsed) {
        width: calc(100vw - 32px);
        height: calc(100vh - 32px);
        max-height: none;
        z-index: 30;
      }

      #panel-config .config-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 0;
        flex-shrink: 0;
      }

      #panel-config .config-header .title {
        margin-bottom: 0;
      }

      #btn-config-toggle {
        padding: 4px 10px;
        font-size: 12px;
        flex-shrink: 0;
        min-width: 3.5em;
      }

      #panel-config.is-collapsed {
        width: auto;
        height: auto;
        gap: 0;
      }

      #panel-config.is-collapsed #config-body {
        display: none;
      }

      #config-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        flex: 1;
      }

      #panel-config .config-scroll {
        overflow: auto;
        overscroll-behavior: contain;
        padding-right: 2px;
        flex: 1;
        min-height: 0;
      }

      /* 每个兵种一列固定宽度，从左排布；超出可左右滚动 */
      #config-form {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: flex-start;
        gap: 12px;
        align-items: start;
        width: max-content;
      }

      .config-unit {
        flex: 0 0 220px;
        width: 220px;
        box-sizing: border-box;
        padding: 10px 10px 4px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--panel-border);
      }

      .config-unit-title {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--text);
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--panel-border);
      }

      .config-row {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }

      .config-label {
        color: var(--text-dim);
        line-height: 1.25;
      }

      .config-label small {
        display: block;
        font-size: 10px;
        opacity: 0.75;
      }

      #panel-config input,
      #panel-config select {
        width: 100%;
        font: inherit;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        padding: 5px 8px;
      }

      #panel-config input:focus,
      #panel-config select:focus {
        outline: none;
        border-color: var(--accent);
      }

      #config-status {
        min-height: 1.2em;
        font-size: 11px;
        color: var(--text-dim);
      }

      #config-status[data-tone='ok'] {
        color: var(--accent);
      }

      #config-status[data-tone='error'] {
        color: var(--red);
      }

      .title {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 10px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 5px 14px;
        font-variant-numeric: tabular-nums;
      }

      .stats-grid dt {
        color: var(--text-dim);
      }

      .stats-grid dd {
        margin: 0;
        text-align: right;
        font-family: 'Cascadia Mono', 'Consolas', monospace;
      }

      .btn-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      button {
        pointer-events: auto;
        font: inherit;
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.06s;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      button:active {
        transform: translateY(1px);
      }

      button[aria-pressed='true'] {
        background: rgba(99, 214, 138, 0.16);
        border-color: var(--accent);
        color: #d8ffe6;
      }

      #faction-group button[data-faction='0'][aria-pressed='true'] {
        background: rgba(79, 141, 253, 0.24);
        border-color: var(--blue);
        color: #dcebff;
      }

      #faction-group button[data-faction='1'][aria-pressed='true'] {
        background: rgba(242, 96, 79, 0.24);
        border-color: var(--red);
        color: #ffe1da;
      }

      kbd {
        display: inline-block;
        min-width: 18px;
        padding: 1px 5px;
        margin-right: 2px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--panel-border);
        font-family: 'Cascadia Mono', 'Consolas', monospace;
        font-size: 11px;
        text-align: center;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main id="main-menu" aria-hidden="false">
      <div class="lobby-shell">
        <header class="lobby-topbar">
          <div class="player-card">
            <div class="player-avatar" aria-hidden="true">PB</div>
            <div class="player-copy">
              <div class="player-name">指挥官</div>
              <div class="player-level">等级 01</div>
            </div>
          </div>
        </header>

        <section class="lobby-hero">
          <div class="hero-mark" aria-hidden="true">P</div>
          <div class="lobby-kicker">Tactical Card Battle</div>
          <h1 class="lobby-title">PokerBattle</h1>
          <p class="lobby-subtitle">组合你的阵容，在有限的战场上创造无限解法。</p>
        </section>

        <section class="lobby-actions" aria-label="主要玩法">
          <div class="lobby-play-row">
            <button id="btn-solo" class="play-entry" type="button" data-placeholder="单机模式">
              单机模式
              <small>COMING SOON</small>
            </button>
            <button id="btn-match" class="play-entry" type="button" data-placeholder="匹配">
              匹配
              <small>COMING SOON</small>
            </button>
          </div>
          <div id="lobby-status" role="status" aria-live="polite">功能正在筹备中</div>
        </section>

        <nav class="lobby-nav" aria-label="功能入口">
          <button class="nav-entry" type="button" data-placeholder="卡组">
            <span class="nav-icon" aria-hidden="true">▣</span>
            <span class="nav-label">卡组</span>
            <span class="nav-tag">COMING SOON</span>
          </button>
          <button class="nav-entry" type="button" data-placeholder="图鉴">
            <span class="nav-icon" aria-hidden="true">◇</span>
            <span class="nav-label">图鉴</span>
            <span class="nav-tag">COMING SOON</span>
          </button>
          <button id="btn-sandbox" class="nav-entry" type="button">
            <span class="nav-icon" aria-hidden="true">◎</span>
            <span class="nav-label">模拟沙盒</span>
            <span class="nav-tag">MVP</span>
          </button>
        </nav>
      </div>
    </main>

    <div id="app" class="is-hidden"></div>

    <div id="hud" class="is-hidden">
      <button id="btn-back-menu" type="button">返回主界面</button>
      <section class="panel" id="panel-stats">
        <div class="title">模拟状态</div>
        <dl class="stats-grid">
          <dt>Tick</dt>
          <dd id="stat-tick">0</dd>
          <dt>单位</dt>
          <dd id="stat-units">0</dd>
          <dt>飞行物</dt>
          <dd id="stat-projectiles">0</dd>
          <dt>World Hash</dt>
          <dd id="stat-hash">-</dd>
          <dt>FPS</dt>
          <dd id="stat-fps">-</dd>
        </dl>
      </section>

      <section class="panel" id="panel-controls">
        <div class="title">运行控制</div>
        <div class="btn-row">
          <button id="btn-pause" type="button">暂停</button>
          <button id="btn-step" type="button">单步</button>
          <button id="btn-speed" type="button">1x</button>
          <button id="btn-brawl" type="button">开团</button>
          <button id="btn-random-pk" type="button">随机PK</button>
          <button id="btn-clear" type="button">清空</button>
        </div>
      </section>

      <section class="panel" id="panel-config">
        <div class="config-header">
          <div class="title">单位参数</div>
          <button id="btn-config-toggle" type="button" aria-expanded="true">收起</button>
        </div>
        <div id="config-body">
          <div class="config-scroll">
            <div id="config-form"></div>
          </div>
          <div class="btn-row">
            <button id="btn-config-reset" type="button">重置</button>
            <button id="btn-config-save" type="button">保存</button>
          </div>
          <div id="config-status">改完点保存写回配置文件；重置恢复文件快照</div>
        </div>
      </section>

      <section class="panel" id="panel-spawn">
        <div>
          <div class="title">阵营</div>
          <div class="btn-row" id="faction-group">
            <button type="button" data-faction="0" aria-pressed="true">蓝方</button>
            <button type="button" data-faction="1" aria-pressed="false">红方</button>
          </div>
        </div>
        <div>
          <div class="title">兵种</div>
          <div class="btn-row" id="unit-group"></div>
        </div>
      </section>

      <section class="panel" id="panel-help">
        <div class="title">操作</div>
        <div><kbd>左键</kbd> 点击地面放兵</div>
        <div><kbd>拖拽</kbd> 旋转视角 · <kbd>滚轮</kbd> 缩放</div>
        <div><kbd>1</kbd><kbd>2</kbd> 切兵种 · <kbd>Q</kbd><kbd>E</kbd> 切阵营</div>
        <div><kbd>空格</kbd> 暂停 · <kbd>N</kbd> 单步 · <kbd>R</kbd> 清空</div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
